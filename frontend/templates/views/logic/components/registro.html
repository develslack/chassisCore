<div class="auth-container">
    <div class="auth-header">
        <h1>Registro</h1>
        <p>Ingrese datos solicitados a continuación</p>
    </div>
    <form id="form-registro">
        <div class="form-group">
            <label class="form-label">Nombre y Apellido</label>
            <input type="text" class="form-control" id="nombre" required placeholder="Ingrese su Nombre y Apellido">
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required placeholder="Ingrese su email">
        </div>

         <div class="form-group">
            <label class="form-label" for="pass_1">Contraseña</label>
            <div class="input-embedded">
                <input type="password" id="pass_1" class="form-control" required>

                <button type="button"
                        class="btn-input-action" onclick="LibCore.togglePassword('pass_1', this)"
                        data-core-toggle="password"
                        data-target="input-pass"
                        title="Mostrar/Ocultar contraseña">
                    <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="pass_2">Repita Contraseña</label>
            <div class="input-embedded">
                <input type="password" id="pass_2" class="form-control" required>

                <button type="button"
                        class="btn-input-action" onclick="LibCore.togglePassword('pass_2', this)"
                        data-core-toggle="password"
                        data-target="input-pass"
                        title="Mostrar/Ocultar contraseña">
                    <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                </button>
            </div>
        </div>
        <button type="submit" class="btn">Aceptar</button>
    </form>
    <a href="/recupero" class="text-link" data-route="recupero">¿Olvidó su contraseña?</a>
</div>
