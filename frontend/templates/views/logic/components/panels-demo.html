<!-- 1. Panel Estándar con Acento Superior (Submit / Azul) -->
<div class="panel panel-submit">
    <div class="panel-header">
        <div>
            <h3 class="panel-title">
                <span class="icon icon-login icon-sm"></span> Estado del Servidor
            </h3>
            <div class="panel-subtitle">Conexión con el backend en C activa</div>
        </div>
        <div class="panel-actions">
            <!-- Botón Plegar con data-core-toggle="panel" -->
            <button class="btn-panel-toggle" data-core-toggle="panel" title="Plegar/Desplegar">
                ▲
            </button>
        </div>
    </div>
    <div class="panel-body">
        <p>El servicio principal se encuentra respondiendo peticiones sin fluctuaciones de latencia.</p>
    </div>
    <div class="panel-footer">
        <button class="btn btn-default btn-sm">Logs</button>
        <button class="btn btn-submit btn-sm">Reiniciar Servicio</button>
    </div>
</div>

<!-- 2. Panel Plegable con Acento Izquierdo (Warning / Mostaza) -->
<div class="panel panel-warning panel-accent-left">
    <div class="panel-header">
        <h3 class="panel-title">Mantenimiento Programado</h3>
        <button class="btn-panel-toggle" data-core-toggle="panel" title="Plegar/Desplegar">
            ▲
        </button>
    </div>
    <div class="panel-body">
        <p>Se realizará una ventana de actualización a las 02:00 hs. Asegúrese de guardar sus cambios.</p>
    </div>
</div>

<!-- 3. Panel Ficha Corta (Success / Verde) -->
<div class="panel panel-success panel-accent-left">
    <div class="panel-header">
        <h3 class="panel-title">Licencia Activa</h3>
        <span class="btn btn-success btn-sm">Válida</span>
    </div>
</div>
