<div class="auth-container">
    <div class="auth-header">
        <h1>Ingreso</h1>
        <p>Ingrese sus credenciales para acceder</p>
    </div>
    <form id="form-login">
        <div class="form-group">
            <label class="form-label">Usuario o Email</label>
            <input type="text" class="form-control" required placeholder="usuario">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-embedded">
                <input type="password" id="password" class="form-control" required>

                <button type="button"
                        class="btn-input-action" onclick="LibCore.togglePassword('password', this)"
                        data-core-toggle="password"
                        data-target="input-pass"
                        title="Mostrar/Ocultar contraseña">
                    <span class="icon icon-actions-layer-visible-on icon-sm"></span>
                </button>
            </div>
        </div>
        <button type="submit" class="btn">Ingresar al Sistema</button>
    </form>
    <a href="#" class="text-link" data-route="recupero">¿Olvidó su contraseña?</a>
</div>
